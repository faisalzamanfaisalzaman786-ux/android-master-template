name: "📚 Maintain Library Hub (Stable + Auto Fallback)"

on:
  schedule:
    - cron: '0 */6 * * *'   # ہر 6 گھنٹے بعد
  workflow_dispatch:         # Manual trigger

jobs:
  update-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Create directory structure
        run: |
          mkdir -p library_hub/{packages,versions,backups,docs}

      # -------------------------------
      # 1. CORE PACKAGES (with fallback and backup)
      # -------------------------------
      - name: Fetch latest & backup versions
        run: |
          set +e  # Continue even if some package fails
          PACKAGES=("camera" "image_picker" "permission_handler" "share_plus" "path_provider" "image" "flutter_local_notifications" "screen_share_plugin")
          
          echo "[" > library_hub/packages/core.json
          first=true
          for pkg in "${PACKAGES[@]}"; do
            # Check if package exists on pub.dev
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "https://pub.dev/packages/$pkg")
            if [ "$status_code" -eq 200 ]; then
              latest=$(curl -s "https://pub.dev/api/packages/$pkg" | jq -r '.latest.version')
              if [ "$latest" != "null" ] && [ -n "$latest" ]; then
                # Save latest version
                if [ "$first" = true ]; then first=false; else echo "," >> library_hub/packages/core.json; fi
                echo "  { \"name\": \"$pkg\", \"latest_version\": \"$latest\" }" >> library_hub/packages/core.json
                
                # Backup last 3 stable versions (optional)
                versions=$(curl -s "https://pub.dev/api/packages/$pkg" | jq -r '.versions[].version' | head -n 3)
                echo "$versions" > library_hub/backups/${pkg}_versions.txt
              else
                echo "⚠️ $pkg: No valid version found" >> library_hub/versions/failed_checks.log
              fi
            else
              echo "⚠️ $pkg: Package not found (HTTP $status_code)" >> library_hub/versions/failed_checks.log
            fi
          done
          echo "]" >> library_hub/packages/core.json
          set -e

      # -------------------------------
      # 2. STATIC PERMISSIONS (can be updated manually or via API)
      # -------------------------------
      - name: Generate Android permissions (static + optional auto-update)
        run: |
          cat > library_hub/packages/permissions.json << 'EOF'
          [
            { "permission": "android.permission.CAMERA", "description": "کیمرہ", "required_by": ["camera"] },
            { "permission": "android.permission.RECORD_AUDIO", "description": "آواز ریکارڈ", "required_by": ["microphone","speech"] },
            { "permission": "android.permission.READ_EXTERNAL_STORAGE", "description": "اسٹوریج پڑھیں (Android ≤12)", "required_by": ["gallery"] },
            { "permission": "android.permission.WRITE_EXTERNAL_STORAGE", "description": "اسٹوریج لکھیں", "required_by": ["gallery_saver"] },
            { "permission": "android.permission.READ_MEDIA_IMAGES", "description": "تصاویر پڑھیں (Android 13+)", "required_by": ["image_picker"] },
            { "permission": "android.permission.ACCESS_FINE_LOCATION", "description": "لوکیشن", "required_by": ["maps","location"] },
            { "permission": "android.permission.BLUETOOTH_SCAN", "description": "بلوٹوتھ اسکین", "required_by": ["bluetooth"] },
            { "permission": "android.permission.POST_NOTIFICATIONS", "description": "نوٹیفیکیشنز", "required_by": ["notifications"] },
            { "permission": "android.permission.BODY_SENSORS", "description": "جسمانی سینسرز", "required_by": ["health"] }
          ]
          EOF

      # -------------------------------
      # 3. SENSORS LIST (static for now, can be extended)
      # -------------------------------
      - name: Generate sensors data
        run: |
          cat > library_hub/packages/sensors.json << 'EOF'
          [
            { "sensor": "accelerometer", "permission": "none", "description": "حرکت" },
            { "sensor": "gyroscope", "permission": "none", "description": "گھماؤ" },
            { "sensor": "magnetometer", "permission": "none", "description": "کمپس" },
            { "sensor": "heart_rate", "permission": "android.permission.BODY_SENSORS", "description": "دل کی دھڑکن" }
          ]
          EOF

      # -------------------------------
      # 4. TEMPLATES (main.dart and AndroidManifest.xml samples)
      # -------------------------------
      - name: Add sample templates (optional)
        run: |
          mkdir -p library_hub/templates
          cat > library_hub/templates/main_sample.dart << 'EOF'
          // نمونہ main.dart - آپ اپنی مرضی سے بدل سکتے ہیں
          import 'package:flutter/material.dart';
          void main() => runApp(MyApp());
          class MyApp extends StatelessWidget {
            @override Widget build(BuildContext context) => MaterialApp(home: Scaffold(body: Center(child: Text('Your code here'))));
          }
          EOF
          
          cat > library_hub/templates/AndroidManifest_sample.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- اپنی مرضی کی پرمیشنز یہاں شامل کریں -->
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="MyApp" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # -------------------------------
      # 5. README AND TIMESTAMP
      # -------------------------------
      - name: Generate README
        run: |
          cat > library_hub/docs/README.md << 'EOF'
          # 📚 Library Hub - خودکار اپ ڈیٹ ہونے والا مستحکم مرکز
          یہ ہب ہر 6 گھنٹے بعد خود ریفریش ہوتا ہے۔
          ## فولڈرز
          - **packages/** : تازہ ترین پیکجز، پرمیشنز، سینسرز
          - **backups/** : پچھلے 3 ورژنز کی بیک اپ
          - **versions/** : لاگ اور ناکام پیکجز کی فہرست
          - **templates/** : main.dart اور AndroidManifest.xml کے نمونے
          EOF

      - name: Save update timestamp
        run: date -u '+%Y-%m-%d %H:%M:%S UTC' > library_hub/versions/last_updated.txt

      # -------------------------------
      # 6. COMMIT AND PUSH CHANGES
      # -------------------------------
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library_hub/
          git diff --staged --quiet || git commit -m "🤖 Auto-update Library Hub (with fallback & backups)"
          git push
        continue-on-error: true
