name: Filter App Builder (Repo pubspec.yaml only)

on:
  repository_dispatch:
    types: [filter_app_build]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Save payload
        run: echo '${{ toJson(github.event.client_payload) }}' > payload.json

      - name: Extract config
        run: |
          PACKAGE_NAME=$(jq -r '.build_config.package_name // "com.filter.app"' payload.json)
          APP_NAME=$(jq -r '.build_config.app_display_name // "Filter App"' payload.json)
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Create fresh Flutter project
        run: |
          PKG="${{ env.PACKAGE_NAME }}"
          ORG=$(echo "$PKG" | rev | cut -d. -f2- | rev)
          PROJ=$(echo "$PKG" | rev | cut -d. -f1 | rev)
          # Sanitize project name
          PROJ=$(echo "$PROJ" | tr '-' '_' | sed 's/^[0-9]/_&/')
          rm -rf android ios .dart_tool build
          flutter create --org "$ORG" --project-name "$PROJ" --platforms=android .
          echo "✅ Project created"

      - name: Write main.dart from payload
        run: |
          MAIN_B64=$(jq -r '.source_files.main_dart // ""' payload.json)
          if [ -z "$MAIN_B64" ] || [ "$MAIN_B64" = "null" ]; then
            echo "❌ No main.dart provided"
            exit 1
          fi
          echo "$MAIN_B64" | base64 -d > lib/main.dart

      - name: Write AndroidManifest.xml from payload
        run: |
          MANIFEST_B64=$(jq -r '.source_files.android_manifest // ""' payload.json)
          if [ -z "$MANIFEST_B64" ] || [ "$MANIFEST_B64" = "null" ]; then
            echo "❌ No AndroidManifest.xml provided"
            exit 1
          fi
          mkdir -p android/app/src/main
          echo "$MANIFEST_B64" | base64 -d > android/app/src/main/AndroidManifest.xml

      - name: Use repository pubspec.yaml
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ pubspec.yaml not found in repository root"
            exit 1
          fi
          flutter pub get

      - name: Generate build.gradle (Groovy) from scratch
        run: |
          cat > android/build.gradle <<'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.3.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          rootProject.buildDir = '../build'
          subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
          subprojects { project.evaluationDependsOn(':app') }
          tasks.register('clean', Delete) { delete rootProject.buildDir }
          EOF

          cat > android/app/build.gradle <<EOF
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "${{ env.PACKAGE_NAME }}"
              compileSdk = 35
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              defaultConfig {
                  applicationId = "${{ env.PACKAGE_NAME }}"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }
          flutter { source = "../.." }
          EOF
          echo "✅ build.gradle generated"

      - name: Update app name in manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i "s/android:label=\".*\"/android:label=\"${{ env.APP_NAME }}\"/" $MANIFEST

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilterApp-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
