name: Filter App Builder

on:
  repository_dispatch:
    types: [filter_app_build]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Save payload to file
        run: echo '${{ toJson(github.event.client_payload) }}' > payload.json

      - name: Extract build config
        run: |
          PACKAGE_NAME=$(jq -r '.build_config.package_name // "com.filter.app"' payload.json)
          APP_NAME=$(jq -r '.build_config.app_display_name // "Filter App"' payload.json)
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Create fresh Flutter project
        run: |
          PKG="${{ env.PACKAGE_NAME }}"
          ORG=$(echo "$PKG" | rev | cut -d. -f2- | rev)
          PROJ=$(echo "$PKG" | rev | cut -d. -f1 | rev)
          # Sanitize project name (replace hyphens, etc.)
          PROJ=$(echo "$PROJ" | tr '-' '_')
          rm -rf android ios .dart_tool build
          flutter create --org "$ORG" --project-name "$PROJ" --platforms=android .

      - name: Write main.dart from payload
        run: |
          MAIN_B64=$(jq -r '.source_files.main_dart // ""' payload.json)
          if [ -z "$MAIN_B64" ] || [ "$MAIN_B64" = "null" ]; then
            echo "❌ No main.dart provided"
            exit 1
          fi
          echo "$MAIN_B64" | base64 -d > lib/main.dart

      - name: Write AndroidManifest.xml from payload
        run: |
          MANIFEST_B64=$(jq -r '.source_files.android_manifest // ""' payload.json)
          if [ -z "$MANIFEST_B64" ] || [ "$MANIFEST_B64" = "null" ]; then
            echo "❌ No AndroidManifest.xml provided"
            exit 1
          fi
          mkdir -p android/app/src/main
          echo "$MANIFEST_B64" | base64 -d > android/app/src/main/AndroidManifest.xml

      - name: Use repository pubspec.yaml (no overwrite)
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ pubspec.yaml not found in repository!"
            exit 1
          fi
          flutter pub get

      - name: Fix package name in build.gradle and manifest
        run: |
          # Update namespace and applicationId
          sed -i "s/namespace \".*\"/namespace \"${{ env.PACKAGE_NAME }}\"/" android/app/build.gradle
          sed -i "s/applicationId \".*\"/applicationId \"${{ env.PACKAGE_NAME }}\"/" android/app/build.gradle
          # Remove package attribute from manifest (if present)
          sed -i 's/package="[^"]*"//' android/app/src/main/AndroidManifest.xml

      - name: Update app name
        run: |
          sed -i "s/android:label=\".*\"/android:label=\"${{ env.APP_NAME }}\"/" android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilterApp-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
