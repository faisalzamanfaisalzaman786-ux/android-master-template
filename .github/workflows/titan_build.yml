name: System Pro Build APK

on:
  repository_dispatch:
    types: [android_full_build]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name (e.g., com.example.app)'
        required: false
        default: 'com.systempro.default'
        type: string
      app_name:
        description: 'App display name'
        required: false
        default: 'SystemProApp'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Determine package and app names
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            PKG=$(echo "${{ github.event.client_payload.package_name }}" | base64 --decode)
            echo "CUSTOM_PACKAGE=$PKG" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            echo "CUSTOM_PACKAGE=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
          else
            echo "CUSTOM_PACKAGE=com.systempro.default" >> $GITHUB_ENV
          fi

          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP=$(echo "${{ github.event.client_payload.app_name }}" | base64 --decode)
            echo "CUSTOM_APPNAME=$APP" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.app_name }}" ]; then
            echo "CUSTOM_APPNAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
          else
            echo "CUSTOM_APPNAME=SystemProApp" >> $GITHUB_ENV
          fi

      - name: Update Android files with custom package and app name (safe mode)
        run: |
          # Update AndroidManifest.xml if it exists
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i "s/package=\".*\"/package=\"$CUSTOM_PACKAGE\"/" app/src/main/AndroidManifest.xml
            echo "Updated AndroidManifest.xml"
          else
            echo "⚠️ AndroidManifest.xml not found – skipping"
          fi

          # Update app/build.gradle if it exists
          if [ -f app/build.gradle ]; then
            sed -i "s/namespace \".*\"/namespace \"$CUSTOM_PACKAGE\"/" app/build.gradle
            sed -i "s/applicationId \".*\"/applicationId \"$CUSTOM_PACKAGE\"/" app/build.gradle
            echo "Updated app/build.gradle"
          else
            echo "⚠️ app/build.gradle not found – skipping"
          fi

          # Update Java files if the directory exists
          if [ -d app/src/main/java ]; then
            find app/src/main/java -name "*.java" -exec sed -i "s/package .*;/package $CUSTOM_PACKAGE;/g" {} \;
            echo "Updated Java files"
          else
            echo "⚠️ app/src/main/java not found – skipping (no Java files to update)"
          fi

          # Update strings.xml if it exists
          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$CUSTOM_APPNAME<\/string>/" app/src/main/res/values/strings.xml
            echo "Updated strings.xml"
          else
            echo "⚠️ strings.xml not found – skipping"
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle wrapper (version 8.5)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
