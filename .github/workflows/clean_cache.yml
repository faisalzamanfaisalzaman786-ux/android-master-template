name: Clean Cache

on:
  repository_dispatch:
    types: [clean_cache]

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Clean Flutter cache
        run: |
          flutter clean
          rm -rf ~/.pub-cache
          rm -rf build/
          rm -rf .dart_tool/
          echo "✅ All caches cleared"

      - name: Clean Gradle cache (optional)
        run: |
          cd android && ./gradlew clean || true
          cd ..
