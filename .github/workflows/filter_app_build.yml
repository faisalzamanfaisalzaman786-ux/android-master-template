name: Setup Fixed Tools Repository

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to store tools (e.g., main or tools)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clean everything except .git and workflow files
        run: |
          # Remove all files and folders except .git and .github/workflows
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} \;
          # Ensure .github/workflows exists
          mkdir -p .github/workflows

      - name: Create tool directories
        run: |
          mkdir -p flutter android-sdk jdk gradle
          echo "Directories created."

      # ========== 1. Download and extract Flutter SDK (Fixed version: 3.38.4) ==========
      - name: Download Flutter SDK
        run: |
          curl -L -o flutter.tar.xz https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.4-stable.tar.xz
          tar -xf flutter.tar.xz -C flutter --strip-components=1
          rm flutter.tar.xz
          echo "Flutter 3.38.4 extracted."

      # ========== 2. Download and extract Android SDK Command Line Tools (Fixed version: 11076708) ==========
      - name: Download Android SDK Command Line Tools
        run: |
          curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools
          unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          rm cmdline-tools.zip
          # Accept licenses automatically (optional but good)
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install required platform and build tools
          android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "Android SDK (API 34, build-tools 34.0.0) installed."

      # ========== 3. Download and extract JDK 17 (Fixed: Temurin 17.0.10+7) ==========
      - name: Download JDK 17
        run: |
          curl -L -o jdk.tar.gz https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.10%2B7/OpenJDK17U-jdk_x64_linux_hotspot_17.0.10_7.tar.gz
          mkdir -p jdk
          tar -xzf jdk.tar.gz -C jdk --strip-components=1
          rm jdk.tar.gz
          echo "JDK 17.0.10+7 extracted."

      # ========== 4. (Optional) Download Gradle fixed version ==========
      - name: Download Gradle 8.6
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip -d gradle
          mv gradle/gradle-8.6/* gradle/
          rmdir gradle/gradle-8.6
          rm gradle.zip
          echo "Gradle 8.6 extracted."

      # ========== 5. Create a version manifest file ==========
      - name: Create versions.json
        run: |
          cat > versions.json << EOF
          {
            "flutter": "3.38.4",
            "android_sdk": {
              "cmdline_tools": "11076708",
              "platform": "android-34",
              "build_tools": "34.0.0"
            },
            "jdk": "17.0.10+7",
            "gradle": "8.6"
          }
          EOF
          echo "versions.json created."

      # ========== 6. Optionally create a sample pubspec.yaml with fixed dependencies ==========
      - name: Create fixed pubspec.yaml
        run: |
          cat > pubspec.yaml << EOF
          name: fixed_build_environment
          description: Fixed dependencies for offline APK building
          version: 1.0.0
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            camera: 0.11.0
            image_picker: 1.1.0
            permission_handler: 11.3.1
            image: 4.3.0
            path_provider: 2.1.5
            share_plus: 10.1.0
            gal: 2.3.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: 5.0.0
          flutter:
            uses-material-design: true
          EOF
          echo "Fixed pubspec.yaml created."

      # ========== 7. Commit and push all tools to the repository ==========
      - name: Commit and push changes
        run: |
          git add .
          git commit -m "Add fixed build tools: Flutter 3.38.4, Android SDK API 34, JDK 17.0.10, Gradle 8.6, fixed pubspec.yaml"
          git push origin ${{ github.event.inputs.branch }}
