name: One-time Flutter Project Structure Creator

on:
  workflow_dispatch:    # صرف مینولی رن کے لیے

permissions:
  contents: write       # تاکہ یہ ریپازٹری میں فائلیں push کر سکے

jobs:
  create-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (fixed version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project (overwrite if exists)
        run: |
          # اگر پہلے سے کوئی پرانی فائلیں ہیں تو ہٹا دیں (صاف سلیٹ)
          rm -rf .dart_tool .packages pubspec.lock android ios lib test
          # نیا Flutter پروجیکٹ بنائیں
          flutter create --platforms=android --project-name=my_app --org=com.example .
          # pubspec.lock کو بھی محفوظ کر لیں (dependencies freeze)
          git add .

      - name: Commit and push the generated structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add Flutter project structure (one-time setup)" || echo "No changes to commit"
          git push
