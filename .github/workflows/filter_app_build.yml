name: Build Flutter APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 📁 یہاں پورا Flutter پروجیکٹ سٹرکچر بنا رہے ہیں
      - name: Create Flutter Project Structure
        run: |
          # ایک نیا Flutter پروجیکٹ generate کرتے ہیں
          flutter create --platforms=android --project-name=dynamic_app --org=com.filter ./temp_project
          
          # تمام ضروری فائلوں کو main ریپوزٹری میں کاپی کریں
          cp -r temp_project/* .
          cp -r temp_project/.gitignore .
          
          # main.dart کو payload سے replace کر دیں
          echo '${{ github.event.client_payload.main_dart }}' | base64 --decode > lib/main.dart
          
          # اگر pubspec.yaml payload میں بھیجا گیا ہے تو اسے replace کر دیں
          if [ -n "${{ github.event.client_payload.pubspec_yaml }}" ]; then
            echo '${{ github.event.client_payload.pubspec_yaml }}' | base64 --decode > pubspec.yaml
          fi
          
          # clean-up
          rm -rf temp_project

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
