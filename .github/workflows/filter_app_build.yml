name: Filter App Builder (Version-Free, Fully Automatic)

on:
  repository_dispatch:
    types: [filter_app_build]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Save payload
        run: echo '${{ toJson(github.event.client_payload) }}' > payload.json

      - name: Extract config
        run: |
          PACKAGE_NAME=$(jq -r '.build_config.package_name // "com.filter.app"' payload.json)
          APP_NAME=$(jq -r '.build_config.app_display_name // "Filter App"' payload.json)
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Create fresh Flutter project
        run: |
          PKG="${{ env.PACKAGE_NAME }}"
          ORG=$(echo "$PKG" | rev | cut -d. -f2- | rev)
          PROJ=$(echo "$PKG" | rev | cut -d. -f1 | rev | tr '-' '_' | sed 's/^[0-9]/_&/')
          rm -rf android ios .dart_tool build
          flutter create --org "$ORG" --project-name "$PROJ" --platforms=android .

      - name: Write main.dart
        run: |
          MAIN_B64=$(jq -r '.source_files.main_dart // ""' payload.json)
          [ -z "$MAIN_B64" ] || [ "$MAIN_B64" = "null" ] && echo "❌ No main.dart" && exit 1
          echo "$MAIN_B64" | base64 -d > lib/main.dart

      - name: Write raw AndroidManifest.xml
        run: |
          MANIFEST_B64=$(jq -r '.source_files.android_manifest // ""' payload.json)
          [ -z "$MANIFEST_B64" ] || [ "$MANIFEST_B64" = "null" ] && echo "❌ No manifest" && exit 1
          mkdir -p android/app/src/main
          echo "$MANIFEST_B64" | base64 -d > android/app/src/main/AndroidManifest.xml.raw

      - name: Write raw pubspec.yaml
        run: |
          PUBSPEC_B64=$(jq -r '.source_files.pubspec_yaml // ""' payload.json)
          if [ -n "$PUBSPEC_B64" ] && [ "$PUBSPEC_B64" != "null" ]; then
            echo "$PUBSPEC_B64" | base64 -d > pubspec.yaml.raw
          else
            echo "❌ No pubspec.yaml in payload" && exit 1
          fi

      # ========== CLEAN PUBSPEC.YAML (NO VERSIONS, ONLY NAMES) ==========
      - name: Create clean pubspec.yaml
        run: |
          # Start a fresh pubspec with required fields
          cat > pubspec.yaml <<'EOF'
          name: filter_app
          description: Auto-generated Flutter app
          version: 1.0.0+1
          publish_to: none

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: any

          flutter:
            uses-material-design: true
          EOF

          # Extract dependency names from raw pubspec (skip flutter, cupertino_icons, etc.)
          # and add them with "any" version under dependencies
          grep -E '^[ ]+[a-zA-Z_][a-zA-Z0-9_]*:' pubspec.yaml.raw | while read line; do
            pkg=$(echo "$line" | cut -d: -f1 | xargs)
            # Skip special ones that are already handled
            if [[ "$pkg" == "flutter" ]] || [[ "$pkg" == "flutter_test" ]] || [[ "$pkg" == "cupertino_icons" ]]; then
              continue
            fi
            # Add the package (if not already present)
            if ! grep -q "^[ ]*$pkg:" pubspec.yaml; then
              # Insert before the last line (flutter: uses-material-design) or at end of dependencies
              sed -i "/^dependencies:/a\  $pkg: any" pubspec.yaml
            fi
          done
          echo "✅ Clean pubspec.yaml created"

      # ========== AUTO-FIX ANDROID PERMISSIONS ==========
      - name: Auto-fix Android permissions
        run: |
          cp android/app/src/main/AndroidManifest.xml.raw android/app/src/main/AndroidManifest.xml
          REQUIRED_PERMS=(
            "android.permission.INTERNET"
            "android.permission.ACCESS_NETWORK_STATE"
          )
          if grep -qi "camera" lib/main.dart; then
            REQUIRED_PERMS+=("android.permission.CAMERA")
          fi
          if grep -qi "image_picker" lib/main.dart; then
            REQUIRED_PERMS+=("android.permission.READ_MEDIA_IMAGES")
            REQUIRED_PERMS+=("android.permission.READ_EXTERNAL_STORAGE")
          fi
          if grep -qi "gal\|GallerySaver" lib/main.dart; then
            REQUIRED_PERMS+=("android.permission.READ_MEDIA_IMAGES")
            REQUIRED_PERMS+=("android.permission.WRITE_EXTERNAL_STORAGE")
          fi
          if grep -qi "location\|geolocator" lib/main.dart; then
            REQUIRED_PERMS+=("android.permission.ACCESS_FINE_LOCATION")
            REQUIRED_PERMS+=("android.permission.ACCESS_COARSE_LOCATION")
          fi
          if grep -qi "audio\|record" lib/main.dart; then
            REQUIRED_PERMS+=("android.permission.RECORD_AUDIO")
          fi
          for perm in "${REQUIRED_PERMS[@]}"; do
            if ! grep -q "<uses-permission android:name=\"$perm\"" android/app/src/main/AndroidManifest.xml; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" android/app/src/main/AndroidManifest.xml
              echo "➕ Added $perm"
            fi
          done

      - name: Get dependencies
        run: flutter pub get

      - name: Create assets folder
        run: mkdir -p assets

      # ========== RELEASE SIGNING (optional) ==========
      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          fi

      - name: Create key.properties
        run: |
          if [ -f "android/app/release-keystore.jks" ]; then
            printf "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}\n" > android/key.properties
            printf "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}\n" >> android/key.properties
            printf "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}\n" >> android/key.properties
            printf "storeFile=release-keystore.jks\n" >> android/key.properties
          fi

      - name: Write top-level build.gradle
        run: |
          printf '%s\n' \
            'buildscript {' \
            '    ext.kotlin_version = "1.9.0"' \
            '    repositories { google(); mavenCentral() }' \
            '    dependencies {' \
            '        classpath "com.android.tools.build:gradle:7.3.0"' \
            '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"' \
            '    }' \
            '}' \
            'allprojects { repositories { google(); mavenCentral() } }' \
            'rootProject.buildDir = "../build"' \
            'subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }' \
            'subprojects { project.evaluationDependsOn(":app") }' \
            'tasks.register("clean", Delete) { delete rootProject.buildDir }' \
            > android/build.gradle

      - name: Write app/build.gradle (signed or debug)
        run: |
          if [ -f "android/key.properties" ]; then
            printf '%s\n' \
              'plugins { id "com.android.application"; id "kotlin-android"; id "dev.flutter.flutter-gradle-plugin" }' \
              'def keystoreProperties = new Properties()' \
              'def keystorePropertiesFile = rootProject.file("key.properties")' \
              'if (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }' \
              'android {' \
              '    namespace "'${{ env.PACKAGE_NAME }}'"' \
              '    compileSdk = 35' \
              '    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' \
              '    kotlinOptions { jvmTarget = "17" }' \
              '    defaultConfig { applicationId "'${{ env.PACKAGE_NAME }}'"; minSdk = 21; targetSdk = 34; versionCode = 1; versionName = "1.0" }' \
              '    signingConfigs { release { keyAlias keystoreProperties["keyAlias"]; keyPassword keystoreProperties["keyPassword"]; storeFile file(keystoreProperties["storeFile"] ?: "release-keystore.jks"); storePassword keystoreProperties["storePassword"] } }' \
              '    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false; shrinkResources false } }' \
              '}' \
              'flutter { source = "../.." }' \
              > android/app/build.gradle
          else
            printf '%s\n' \
              'plugins { id "com.android.application"; id "kotlin-android"; id "dev.flutter.flutter-gradle-plugin" }' \
              'android {' \
              '    namespace "'${{ env.PACKAGE_NAME }}'"' \
              '    compileSdk = 35' \
              '    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' \
              '    kotlinOptions { jvmTarget = "17" }' \
              '    defaultConfig { applicationId "'${{ env.PACKAGE_NAME }}'"; minSdk = 21; targetSdk = 34; versionCode = 1; versionName = "1.0" }' \
              '    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false; shrinkResources false } }' \
              '}' \
              'flutter { source = "../.." }' \
              > android/app/build.gradle
          fi

      - name: Update app name
        run: |
          sed -i "s/android:label=\".*\"/android:label=\"${{ env.APP_NAME }}\"/" android/app/src/main/AndroidManifest.xml

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Apply custom icon
        run: |
          ICON_B64=$(jq -r '.assets.app_icon_base64 // ""' payload.json)
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "null" ]; then
            echo "$ICON_B64" | base64 -d > /tmp/icon_raw.png
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in mdpi) size=48;; hdpi) size=72;; xhdpi) size=96;; xxhdpi) size=144;; xxxhdpi) size=192;; esac
              mkdir -p android/app/src/main/res/mipmap-$density
              convert /tmp/icon_raw.png -resize ${size}x${size} android/app/src/main/res/mipmap-$density/ic_launcher.png
            done
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilterApp-APK-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: FilterApp-AAB-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
