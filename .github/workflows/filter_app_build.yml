name: Flutter APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'   # or stable
          channel: 'stable'

      # ------------------------------------------------------------------
      # Step that previously failed: restore AndroidManifest from backup
      # Now safe: only runs if backup file exists, otherwise skips
      # ------------------------------------------------------------------
      - name: Restore custom AndroidManifest (if backup exists)
        run: |
          BACKUP_DIR="android_manifest_backup"
          BACKUP_FILE="$BACKUP_DIR/AndroidManifest.xml"
          if [ -f "$BACKUP_FILE" ]; then
            echo "Found backup manifest, restoring to android/app/src/main/"
            mkdir -p android/app/src/main
            cp "$BACKUP_FILE" android/app/src/main/AndroidManifest.xml
          else
            echo "No backup manifest found at $BACKUP_FILE – skipping restore"
          fi

      # ------------------------------------------------------------------
      # Write main.dart from a payload (example: from environment variable)
      # Adjust source as needed (e.g., from a secret or file)
      # ------------------------------------------------------------------
      - name: Write main.dart from payload
        run: |
          PAYLOAD="${{ secrets.MAIN_DART_PAYLOAD }}"   # store your code in GitHub secret
          if [ -n "$PAYLOAD" ]; then
            mkdir -p lib
            echo "$PAYLOAD" > lib/main.dart
            echo "main.dart written from secret payload"
          else
            echo "No payload secret provided – using existing lib/main.dart"
          fi

      # ------------------------------------------------------------------
      # Use repository's pubspec.yaml (already checked out)
      # ------------------------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # ------------------------------------------------------------------
      # Copy custom AndroidManifest.xml (if provided in repo root)
      # ------------------------------------------------------------------
      - name: Copy custom AndroidManifest (if present)
        run: |
          if [ -f "custom_AndroidManifest.xml" ]; then
            mkdir -p android/app/src/main
            cp custom_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "Applied custom AndroidManifest.xml from repository root"
          else
            echo "No custom_AndroidManifest.xml found – using default"
          fi

      # ------------------------------------------------------------------
      # Remove deprecated package attribute from manifest (if any)
      # ------------------------------------------------------------------
      - name: Remove deprecated package attribute
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/package="[^"]*"//g' "$MANIFEST"
            echo "Removed package attribute (if present)"
          fi

      # ------------------------------------------------------------------
      # Update app name in AndroidManifest.xml
      # ------------------------------------------------------------------
      - name: Update app name
        run: |
          APP_NAME="My Flutter App"   # change as needed
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s/<application /<application android:label=\"$APP_NAME\" /" "$MANIFEST"
          fi

      # ------------------------------------------------------------------
      # Fix Kotlin directory structure (ensure main/kotlin exists)
      # ------------------------------------------------------------------
      - name: Fix Kotlin directory structure
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/app
          echo "Kotlin directories created"

      # ------------------------------------------------------------------
      # Generate build.gradle (Groovy) – optional, only if missing
      # ------------------------------------------------------------------
      - name: Generate build.gradle (if missing)
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            cat > android/app/build.gradle << 'EOF'
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localPropertiesFile.withReader('UTF-8') { reader ->
                    localProperties.load(reader)
                }
            }
            def flutterRoot = localProperties.getProperty('flutter.sdk')
            if (flutterRoot == null) {
                throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
            }
            apply plugin: 'com.android.application'
            apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
            android {
                compileSdkVersion 34
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
                defaultConfig {
                    applicationId "com.example.app"
                    minSdkVersion 21
                    targetSdkVersion 34
                    versionCode 1
                    versionName "1.0"
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.debug
                    }
                }
            }
            flutter {
                source '../..'
            }
            EOF
            echo "Generated default build.gradle"
          else
            echo "build.gradle already exists"
          fi

      # ------------------------------------------------------------------
      # Apply custom app icon (improved) – copy from assets if available
      # ------------------------------------------------------------------
      - name: Apply custom app icon
        run: |
          if [ -f "assets/ic_launcher.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-hdpi
            cp assets/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            echo "Custom icon applied (simple override)"
          else
            echo "No custom icon found – using default"
          fi

      # ------------------------------------------------------------------
      # Build release APK
      # ------------------------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release

      # ------------------------------------------------------------------
      # Upload APK artifact
      # ------------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
