name: Filter App Builder (Auto Project Creator)

on:
  repository_dispatch:
    types: [filter_app_build]   # یہ وہی event ہے جو UI بھیجتا ہے

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 📁 1. ایک نیا Flutter پروجیکٹ جنریٹ کریں (پورا سٹرکچر)
      - name: Create Flutter project structure
        run: |
          flutter create --platforms=android --project-name=auto_filter_app --org=com.filter ./temp_project
          cp -r temp_project/. .
          cp -r temp_project/.gitignore .
          rm -rf temp_project

      # 📄 2. بھیجی گئی main.dart کو lib/main.dart میں ڈالیں
      - name: Decode and place main.dart
        run: |
          echo '${{ github.event.client_payload.source_files.main_dart }}' | base64 -d > lib/main.dart

      # 📄 3. بھیجی گئی AndroidManifest.xml کو صحیح جگہ رکھیں
      - name: Decode and place AndroidManifest.xml
        run: |
          mkdir -p android/app/src/main
          echo '${{ github.event.client_payload.source_files.android_manifest }}' | base64 -d > android/app/src/main/AndroidManifest.xml

      # 📄 4. بھیجی گئی pubspec.yaml کو جڑ میں رکھیں
      - name: Decode and place pubspec.yaml
        run: |
          echo '${{ github.event.client_payload.source_files.pubspec_yaml }}' | base64 -d > pubspec.yaml

      # 🖼️ 5. اگر icon بھیجا گیا ہو تو اسے لگائیں
      - name: Decode and set app icon
        run: |
          ICON_BASE64="${{ github.event.client_payload.assets.app_icon_base64 }}"
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > /tmp/icon.png
            # Flutter کے لیے Android icons بنانے کا آسان طریقہ (فوری)
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            # تبدیل کرنے کی بجائے ایک ہی تصویر کو کاپی کر دیں (مکمل حل کے لیے imagemagick لگے گا، لیکن یہ بیس لائن ہے)
            cp /tmp/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp /tmp/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp /tmp/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp /tmp/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp /tmp/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      # 📦 6. پیکیج نام اور ایپ کا نام manifest میں سیٹ کریں (اگر مختلف ہو)
      - name: Update package name and app label
        run: |
          PACKAGE="${{ github.event.client_payload.build_config.package_name }}"
          APP_NAME="${{ github.event.client_payload.build_config.app_display_name }}"
          if [ -n "$PACKAGE" ]; then
            # Android package name بدلنا (sed کے ذریعے)
            sed -i "s/package=\"com\.filter\.auto_filter_app\"/package=\"$PACKAGE\"/g" android/app/src/main/AndroidManifest.xml
          fi
          if [ -n "$APP_NAME" ]; then
            sed -i "s/android:label=\"auto_filter_app\"/android:label=\"$APP_NAME\"/g" android/app/src/main/AndroidManifest.xml
          fi

      # 🔧 7. dependencies انسٹال کریں
      - name: Install dependencies
        run: flutter pub get

      # 🚀 8. APK بنائیں
      - name: Build APK
        run: flutter build apk --release

      # 📤 9. APK کو artifact کے طور پر اپ لوڈ کریں
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filter-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
