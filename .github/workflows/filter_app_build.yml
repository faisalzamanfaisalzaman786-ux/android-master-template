name: Flutter APK Builder (Custom Icon + Dynamic Package Name)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Dynamic Package Name (e.g., com.mycompany.myapp)'
        required: false
        default: 'com.example.app'
      app_name:
        description: 'App Display Name'
        required: false
        default: 'My Flutter App'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # ---------- Dynamic Package Name ----------
      - name: Set package name from input or secret
        id: package
        run: |
          if [ -n "${{ github.event.inputs.package_name }}" ]; then
            PACKAGE="${{ github.event.inputs.package_name }}"
          elif [ -n "${{ secrets.PACKAGE_NAME }}" ]; then
            PACKAGE="${{ secrets.PACKAGE_NAME }}"
          else
            PACKAGE="com.example.app"
          fi
          echo "PACKAGE_NAME=$PACKAGE" >> $GITHUB_ENV
          echo "Using package name: $PACKAGE"

      - name: Update package name in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Change package attribute in manifest tag
            sed -i "s/package=\"[^\"]*\"/package=\"${{ env.PACKAGE_NAME }}\"/" "$MANIFEST"
          fi

      - name: Update package name in build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"${{ env.PACKAGE_NAME }}\"/" "$BUILD_GRADLE"
          fi

      - name: Update Kotlin directory structure (dynamic package)
        run: |
          # Convert com.example.app to com/example/app
          PKG_PATH=$(echo "${{ env.PACKAGE_NAME }}" | tr '.' '/')
          mkdir -p "android/app/src/main/kotlin/$PKG_PATH"
          echo "Kotlin path created: $PKG_PATH"

      # ---------- Custom App Icon (Full Density Support) ----------
      - name: Apply custom app icon (all densities)
        run: |
          # اگر آپ کے پاس mipmap-* فولڈرز میں مختلف سائز کی فائلیں ہیں تو یہ انہیں کاپی کرے گا
          if [ -d "assets/icons" ]; then
            # فرض کریں کہ assets/icons میں یہ فولڈرز ہیں:
            # mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              if [ -f "assets/icons/$density/ic_launcher.png" ]; then
                mkdir -p "android/app/src/main/res/mipmap-$density"
                cp "assets/icons/$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
                echo "Copied $density icon"
              fi
            done
          elif [ -f "assets/ic_launcher.png" ]; then
            # اگر صرف ایک ہی تصویر ہے تو اسے تمام densities میں اسکیل کرنا پڑے گا
            # یہاں ہم سادہ کاپی کر رہے ہیں (مکمل اسکیلنگ کے لیے extra tool چاہیے)
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "android/app/src/main/res/mipmap-$density"
              cp "assets/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            done
            echo "Single icon copied to all densities (scaling not applied)"
          else
            echo "No custom icon found - using default"
          fi

      # ---------- Restore Backup Manifest (safe) ----------
      - name: Restore custom AndroidManifest (if backup exists)
        run: |
          BACKUP_FILE="android_manifest_backup/AndroidManifest.xml"
          if [ -f "$BACKUP_FILE" ]; then
            mkdir -p android/app/src/main
            cp "$BACKUP_FILE" android/app/src/main/AndroidManifest.xml
            echo "Backup manifest restored"
          else
            echo "No backup manifest"
          fi

      # ---------- Write main.dart from payload ----------
      - name: Write main.dart from payload
        run: |
          PAYLOAD="${{ secrets.MAIN_DART_PAYLOAD }}"
          if [ -n "$PAYLOAD" ]; then
            mkdir -p lib
            echo "$PAYLOAD" > lib/main.dart
            echo "main.dart written from secret"
          else
            echo "Using existing lib/main.dart"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Copy custom AndroidManifest from root (if present)
        run: |
          if [ -f "custom_AndroidManifest.xml" ]; then
            mkdir -p android/app/src/main
            cp custom_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Remove deprecated package attribute
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/package="[^"]*"//g' "$MANIFEST"
          fi

      - name: Update app name in AndroidManifest
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="My Flutter App"
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s/<application /<application android:label=\"$APP_NAME\" /" "$MANIFEST"
          fi

      - name: Generate build.gradle (if missing)
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            cat > android/app/build.gradle << EOF
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localPropertiesFile.withReader('UTF-8') { reader ->
                    localProperties.load(reader)
                }
            }
            def flutterRoot = localProperties.getProperty('flutter.sdk')
            if (flutterRoot == null) {
                throw new GradleException("Flutter SDK not found.")
            }
            apply plugin: 'com.android.application'
            apply from: "\$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
            android {
                compileSdkVersion 34
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
                defaultConfig {
                    applicationId "${{ env.PACKAGE_NAME }}"
                    minSdkVersion 21
                    targetSdkVersion 34
                    versionCode 1
                    versionName "1.0"
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.debug
                    }
                }
            }
            flutter {
                source '../..'
            }
            EOF
            echo "Generated build.gradle"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ env.PACKAGE_NAME }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
