name: Filter App Builder (Repair & Build)

on:
  repository_dispatch:
    types: [filter_app_build, clean_cache]

env:
  FLUTTER_VERSION: '3.22.4'
  PUB_CACHE_PATH: ~/.pub-cache

jobs:
  build:
    if: github.event.action == 'filter_app_build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Repair: remove wrong structure
      - name: Remove old/wrong directories
        run: |
          rm -rf app
          rm -rf android/app
          mkdir -p lib android/app/src/main assets
          echo "Cleanup done."

      # Ensure fixed pubspec.yaml exists
      - name: Verify fixed pubspec.yaml
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: No pubspec.yaml found in root"
            exit 1
          fi
          echo "Using fixed pubspec.yaml from repository"

      # Decode files from UI
      - name: Decode main.dart
        run: |
          echo '${{ github.event.client_payload.source_files.main_dart }}' | base64 -d > lib/main.dart

      - name: Decode AndroidManifest.xml
        run: |
          echo '${{ github.event.client_payload.source_files.android_manifest }}' | base64 -d > android/app/src/main/AndroidManifest.xml

      - name: Set build config
        run: |
          echo "BUILD_TYPE=${{ github.event.client_payload.build_config.build_type }}" >> $GITHUB_ENV
          echo "MIN_SDK=${{ github.event.client_payload.build_config.min_sdk }}" >> $GITHUB_ENV
          echo "TARGET_SDK=${{ github.event.client_payload.build_config.target_sdk }}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${{ github.event.client_payload.build_config.package_name }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ github.event.client_payload.build_config.app_display_name }}" >> $GITHUB_ENV
          echo "USE_PROGUARD=${{ github.event.client_payload.build_config.use_proguard }}" >> $GITHUB_ENV

      - name: Decode app icon
        run: |
          ICON_B64='${{ github.event.client_payload.assets.app_icon_base64 }}'
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "null" ]; then
            echo "$ICON_B64" | base64 -d > assets/icon.png
            echo "ICON_PROVIDED=true" >> $GITHUB_ENV
          else
            echo "ICON_PROVIDED=false" >> $GITHUB_ENV
          fi

      # Create default build.gradle if missing
      - name: Create default build.gradle
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            printf '%s\n' \
              'def localProperties = new Properties()' \
              'def localPropertiesFile = rootProject.file("local.properties")' \
              'if (localPropertiesFile.exists()) {' \
              '    localPropertiesFile.withReader("UTF-8") { reader ->' \
              '        localProperties.load(reader)' \
              '    }' \
              '}' \
              'def flutterRoot = localProperties.getProperty("flutter.sdk")' \
              'if (flutterRoot == null) {' \
              '    throw new GradleException("Flutter SDK not found.")' \
              '}' \
              'apply plugin: "com.android.application"' \
              'apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"' \
              'android {' \
              '    compileSdkVersion 34' \
              '    compileOptions {' \
              '        sourceCompatibility JavaVersion.VERSION_17' \
              '        targetCompatibility JavaVersion.VERSION_17' \
              '    }' \
              '    defaultConfig {' \
              '        applicationId "com.example.temp"' \
              '        minSdkVersion 21' \
              '        targetSdkVersion 34' \
              '        versionCode 1' \
              '        versionName "1.0"' \
              '    }' \
              '    buildTypes {' \
              '        release {' \
              '            signingConfig signingConfigs.debug' \
              '        }' \
              '    }' \
              '}' \
              'flutter {' \
              '    source "../.."' \
              '}' > android/app/build.gradle
          fi

      - name: Update package name in build.gradle
        run: |
          sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" android/app/build.gradle
          sed -i "s/namespace \".*\"/namespace \"$PACKAGE_NAME\"/" android/app/build.gradle || true

      - name: Update AndroidManifest with package name and app name
        run: |
          sed -i "s/package=\".*\"/package=\"$PACKAGE_NAME\"/" android/app/src/main/AndroidManifest.xml
          sed -i "s/android:label=\".*\"/android:label=\"$APP_NAME\"/" android/app/src/main/AndroidManifest.xml

      - name: Update minSdk and targetSdk
        run: |
          sed -i "s/minSdkVersion [0-9]\+/minSdkVersion $MIN_SDK/" android/app/build.gradle
          sed -i "s/targetSdkVersion [0-9]\+/targetSdkVersion $TARGET_SDK/" android/app/build.gradle

      - name: Enable ProGuard if requested
        if: env.USE_PROGUARD == 'true'
        run: |
          sed -i '/release {/a \
                minifyEnabled true\
                proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' android/app/build.gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE_PATH }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pre-download dependencies
        run: |
          flutter pub get
          flutter precache --all
        continue-on-error: true

      - name: Build APK offline
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk --release --offline
          else
            flutter build apk --debug --offline
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.BUILD_TYPE }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  clean-cache:
    if: github.event.action == 'clean_cache'
    runs-on: ubuntu-latest
    steps:
      - name: Clear GitHub Actions cache
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const cache of caches.data.actions_caches) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
              console.log(`Deleted cache: ${cache.key}`);
            }
      - name: Log cleanup
        run: echo "Cache cleanup triggered"
