name: universal_app_template
description: A versatile Flutter app template.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  google_fonts: ^6.2.1

  # State
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  get: ^4.6.6

  # Background
  workmanager: ^0.5.2
  flutter_background_service: ^5.0.1
  android_alarm_manager_plus: ^4.0.3

  # Database
  sqflite: ^2.4.1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.7.0
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Device info
  device_info_plus: ^11.1.0
  package_info_plus: ^8.1.0
  battery_plus: ^6.0.0
  sensors_plus: ^6.1.1

  # App interactions
  url_launcher: ^6.3.1
  app_settings: ^5.1.1
  quick_actions: ^1.0.1

  # Permissions
  permission_handler: ^11.3.1

  # Camera & Media
  camera: ^0.11.1
  image_picker: ^1.1.2
  image: ^4.3.0
  gal: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  video_player: ^2.9.2
  record: ^5.2.0
  share_plus: ^10.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Location
  geolocator: ^13.0.2
  location: ^7.0.1

  # Utilities
  connectivity_plus: ^6.1.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

  # WebView
  webview_flutter: ^4.9.0
  flutter_inappwebview: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
